# ─────────────────────────────────────────────────────────────────────────────
#  config/server.conf
#  Helios HTTP Server — Default Configuration
#
#  Format:
#    [section]
#    key = value    # inline comment
#
#  This file is read at startup.  All values have safe built-in defaults;
#  missing keys do not crash the server.
#
#  Usage:
#    .\helios.exe                    # reads this file
#    .\helios.exe path\to\my.conf   # reads alternate file
# ─────────────────────────────────────────────────────────────────────────────

# ── Server ────────────────────────────────────────────────────────────────────
[server]
name            = Helios HTTP Server   # Human-readable server name (sent in Server header)
port            = 8080                 # TCP port to listen on (Phase 1+)
worker_threads  = 4                    # Number of worker threads (Phase 3+)
max_connections = 1000                 # Maximum simultaneous connections (Phase 5+)
request_timeout = 30                   # Seconds before an idle connection is closed (Phase 5+)
keep_alive      = true                 # HTTP Keep-Alive support (Phase 5+)

# ── Logging ───────────────────────────────────────────────────────────────────
[logging]
# One of: TRACE | DEBUG | INFO | WARN | ERROR | FATAL
level = INFO

# ── Routing ───────────────────────────────────────────────────────────────────
[routing]
# Base path prefix for all routes (useful when running behind a reverse proxy)
base_path = /

# ── Cache (Phase 9+) ──────────────────────────────────────────────────────────
[cache]
enabled  = false
ttl_secs = 60     # Default TTL for cached entries (seconds)
max_size = 1000   # Maximum number of entries in the LRU cache

# ── Database (Phase 10+) ──────────────────────────────────────────────────────
[database]
host     = localhost
port     = 5432
name     = helios_db
user     = helios
password =               # Leave blank; use environment variable HELIOS_DB_PASSWORD
pool_min = 2
pool_max = 10

# ── Rate Limiting (Phase 11+) ─────────────────────────────────────────────────
[rate_limit]
enabled          = false
requests_per_sec = 100   # Per-IP request rate limit
algorithm        = token_bucket
